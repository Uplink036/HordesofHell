[project]
name = "hordesofhell"
version = "2026.10.05"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=3.0.6",
    "torch>=2.14.1",
]
authors = [
  { name="Uplink036" },
  { name="s02blom" },
]

[project.scripts]
hordesofhell = "hordesofhell:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "black",
    "isort",
]
notebook = [
    "ipykernel",
    "black[jupyter]",
    "nbdime",
]

[tool.black]
line-length = 80
target-version = ['py314']

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
